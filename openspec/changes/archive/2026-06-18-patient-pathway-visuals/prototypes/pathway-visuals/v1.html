<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PROTOTYPE — pathway-visuals v1</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5/index.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style type="text/tailwindcss">
    @theme {
      --color-background: oklch(1 0 0);
      --color-surface-1: oklch(0.985 0.003 175);
      --color-surface-2: oklch(0.97 0.01 175);
      --color-foreground: oklch(0.21 0.04 265);
      --color-foreground-muted: oklch(0.5 0.02 265);
      --color-muted-foreground: var(--color-foreground-muted);
      --color-card: var(--color-background);
      --color-muted: var(--color-surface-2);
      --color-primary: oklch(0.46 0.07 175);
      --color-primary-soft: oklch(0.93 0.04 175);
      --color-primary-foreground: oklch(1 0 0);
      --color-border: oklch(0.91 0.005 265);
      --color-border-strong: oklch(0.82 0.01 265);
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --shadow-sm: 0 1px 2px oklch(0.21 0.04 265 / 0.06);
      --shadow-md: 0 4px 12px oklch(0.21 0.04 265 / 0.08);
      --font-sans: "Geist Variable", ui-sans-serif, system-ui, sans-serif;
    }
  </style>
  <style>
    :root {
      /* builder phase tints + lane accents (from builder.css) */
      --ph-1-ink:#08453c; --ph-1-soft:#cfede8;
      --ph-2-ink:#5b21b6; --ph-2-soft:#ede9fe;
      --ph-3-ink:#1d4ed8; --ph-3-soft:#dbeafe;
      --ph-4-ink:#92400e; --ph-4-soft:#fef3c7;
      --lane-patient:#266b5e; --lane-caregiver:#2563eb; --lane-system:#7c3aed; --lane-external:#b45309;
    }
    body { font-family: var(--font-sans); background:
      radial-gradient(ellipse 65% 55% at 100% 0%, rgba(111,199,182,0.12) 0%, transparent 70%),
      #f6f8f7; color: var(--color-foreground); }
  </style>
</head>
<body class="min-h-screen">
  <!--
    PROTOTYPE — patient pathway visuals v1
    Mock data: bladder-cancer seed (authoritative 18-block flow), patient Pieter Jansen.
    Current position ("NU") = block 11 "Luscii pre-op data nakijken", phase Pre-operatief.
    Zero fetches. All data inline below. DOM built via createElement (no innerHTML).
  -->
  <div class="mx-auto max-w-3xl px-6 py-8">

    <div class="mb-5 flex items-center gap-3">
      <div class="grid size-10 place-items-center rounded-full bg-[--color-primary-soft] text-[--color-primary] font-semibold">PJ</div>
      <div>
        <h1 class="text-lg font-semibold tracking-tight">Pieter Jansen</h1>
        <p class="text-xs text-[--color-foreground-muted]">68 jr · M · Zorgpad</p>
      </div>
      <button class="ml-auto rounded-md border border-[--color-border] bg-[--color-card] px-3 py-1.5 text-xs font-medium shadow-[--shadow-sm] hover:border-[--color-border-strong]">
        Nog een zorgpad starten
      </button>
    </div>

    <section class="rounded-lg border border-[--color-border] bg-[--color-card] p-5 shadow-[--shadow-sm]">
      <div class="flex flex-wrap items-center gap-2">
        <span class="rounded-full bg-[--color-primary-soft] px-2.5 py-0.5 text-xs font-medium text-[--color-primary]">Actief</span>
        <span class="text-sm font-medium">Blaaskanker (urologie)</span>
        <span class="text-xs text-[--color-foreground-muted]">· Anker: 12 mei 2026</span>
        <button class="ml-auto rounded-md px-2 py-1 text-xs font-medium text-[--color-foreground-muted] hover:bg-[--color-surface-2]">Beheer</button>
      </div>

      <div class="mt-4">
        <div class="flex items-baseline justify-between">
          <p class="text-sm font-semibold">Fase Pre-operatief · stap 11 van 18</p>
          <p class="text-xs text-[--color-foreground-muted]">10 klaar · 1 nu · 7 gepland</p>
        </div>
        <div class="mt-2 h-1.5 w-full overflow-hidden rounded-full bg-[--color-surface-2]">
          <div class="h-full rounded-full bg-[--color-primary]" style="width:58%"></div>
        </div>
      </div>

      <div id="timeline" class="mt-6"></div>
    </section>

    <p class="mt-4 text-center text-[11px] text-[--color-foreground-muted]">PROTOTYPE · pathway-visuals v1 · mock data</p>
  </div>

  <script>
    const LANE = { patient:'--lane-patient', caregiver:'--lane-caregiver', system:'--lane-system', external:'--lane-external' };
    const TINT = ['--ph-1', '--ph-2', '--ph-3', '--ph-4'];
    const STEPS = [
      { phase:'Onboarding', lane:'system',    icon:'flag',         name:'Patiënt toegevoegd',          summary:'systeem · start',                bucket:'finished' },
      { phase:'Onboarding', lane:'external',  icon:'activity',     name:'Aanmelden Luscii-programma',  summary:'extern · monitoring',            bucket:'finished' },
      { phase:'Scans', lane:'caregiver', icon:'calendar',     name:'Afspraak: scan',              summary:'uroloog · beeldvorming',         bucket:'finished' },
      { phase:'Scans', lane:'caregiver', icon:'list-checks',  name:'Taak: scan beoordelen',       summary:'uroloog',                        bucket:'finished' },
      { phase:'Scans', lane:'caregiver', icon:'list-checks',  name:'Taak: diagnostisch MDO voorbereiden', summary:'uroloog',                bucket:'finished' },
      { phase:'Besluit tot biopsie', lane:'caregiver', icon:'users',     name:'MDO (diagnostisch)',          summary:'panel · uroloog (lead)',         bucket:'finished' },
      { phase:'Besluit tot biopsie', lane:'caregiver', icon:'calendar',  name:'Afspraak: uitslag bespreken', summary:'uroloog · consult',              bucket:'finished' },
      { phase:'Besluit tot biopsie', lane:'caregiver', icon:'git-branch',name:'Besluit: opereren?',          summary:'uroloog · uitkomst: opereren',   bucket:'finished' },
      { phase:'Pre-operatief', lane:'caregiver', icon:'calendar',  name:'Afspraak: labtest',           summary:'uroloog · lab',                  bucket:'finished' },
      { phase:'Pre-operatief', lane:'caregiver', icon:'git-branch',name:'Besluit: labtest beoordelen', summary:'uroloog · uitkomst: doorgaan',   bucket:'finished' },
      { phase:'Pre-operatief', lane:'caregiver', icon:'list-checks',name:'Luscii pre-op data nakijken', summary:'verpleegkundige · gate operatie', bucket:'next' },
      { phase:'Pre-operatief', lane:'system',    icon:'send',      name:'Pre-op info versturen',       summary:'systeem · bericht',  chip:'−3 d', bucket:'upcoming' },
      { phase:'Operatiedag', lane:'caregiver', icon:'stethoscope',name:'Operatie',                    summary:'uroloog · ingreep',  chip:'25 jun', bucket:'upcoming' },
      { phase:'Herstel & uitslag', lane:'system',    icon:'send',     name:'Post-op info versturen',      summary:'systeem · bericht',              bucket:'upcoming' },
      { phase:'Herstel & uitslag', lane:'caregiver', icon:'list-checks',name:'Taak: pathologie-uitslag bekijken', summary:'uroloog',                bucket:'upcoming' },
      { phase:'Herstel & uitslag', lane:'caregiver', icon:'users',     name:'MDO (post-operatief)',        summary:'panel · uroloog (lead)',         bucket:'upcoming' },
      { phase:'Diagnose & behandelkeuze', lane:'caregiver', icon:'calendar', name:'Afspraak: bespreken',  summary:'uroloog · consult',              bucket:'upcoming' },
      { phase:'Diagnose & behandelkeuze', lane:'caregiver', icon:'git-branch',name:'Besluit: behandelen?', summary:'uroloog · uitkomst openstaand',  bucket:'upcoming' },
    ];

    // tiny hyperscript: h('div', {class:'..', style:'..', dataLucide:'..'}, ...children)
    function h(tag, props, ...kids) {
      const node = document.createElement(tag);
      if (props) for (const [k, v] of Object.entries(props)) {
        if (v == null) continue;
        if (k === 'class') node.className = v;
        else if (k === 'text') node.textContent = v;
        else node.setAttribute(k, v);
      }
      for (const kid of kids) if (kid != null) node.append(kid);
      return node;
    }
    const icon = (name) => h('i', { 'data-lucide': name, class: 'size-4' });

    function railNode(step) {
      const laneVar = `var(${LANE[step.lane]})`;
      if (step.bucket === 'finished')
        return h('span', { class:'grid size-7 shrink-0 place-items-center rounded-full text-white shadow-[--shadow-sm]', style:`background:${laneVar}` }, icon('check'));
      if (step.bucket === 'next')
        return h('span', { class:'grid size-7 shrink-0 place-items-center rounded-full text-white', style:`background:${laneVar}; box-shadow:0 0 0 4px color-mix(in srgb, ${laneVar} 22%, transparent)` }, h('i',{'data-lucide':'dot', class:'size-5'}));
      return h('span', { class:'size-7 shrink-0 rounded-full border-2 border-[--color-border-strong] bg-[--color-card]' });
    }

    function trailing(step) {
      const laneVar = `var(${LANE[step.lane]})`;
      if (step.bucket === 'finished') return h('span', { class:'shrink-0 text-[11px] font-medium text-[--color-foreground-muted]', text:'klaar' });
      if (step.bucket === 'next') return h('span', { class:'shrink-0 rounded-full px-2 py-0.5 text-[11px] font-semibold text-white', style:`background:${laneVar}`, text:'NU' });
      return h('span', { class:'shrink-0 text-[11px] font-medium text-[--color-foreground-muted]', text:'gepland' });
    }

    function chip(step) {
      if (!step.chip) return null;
      const laneVar = `var(${LANE[step.lane]})`;
      const next = step.bucket === 'next';
      return h('span', {
        class:'ml-auto shrink-0 rounded-full border px-2 py-0.5 text-[11px] font-medium',
        style: next ? `border-color:${laneVar}; color:${laneVar}` : 'border-color:var(--color-border); color:var(--color-foreground-muted)',
        text: step.chip,
      });
    }

    function card(step) {
      const laneVar = `var(${LANE[step.lane]})`;
      const dim = step.bucket === 'finished' ? ' opacity-65' : '';
      const active = step.bucket === 'next'
        ? `border-color:${laneVar}; box-shadow:0 0 0 3px color-mix(in srgb, ${laneVar} 14%, transparent)`
        : 'border-color:var(--color-border)';
      const iconTile = h('span', {
        class:'my-auto ml-2 grid size-8 shrink-0 place-items-center rounded-sm',
        style:`background:color-mix(in srgb, ${laneVar} 12%, var(--color-card)); color:${laneVar}`,
      }, icon(step.icon));
      const texts = h('div', { class:'min-w-0' },
        h('p', { class:'truncate text-[13px] font-semibold tracking-tight', text: step.name }),
        h('p', { class:'truncate text-[11.5px] font-medium text-[--color-foreground-muted]', text: step.summary }),
      );
      const body = h('div', { class:'flex min-w-0 flex-1 items-center gap-2 px-3 py-2' }, texts, chip(step), trailing(step));
      return h('div', {
        class:'flex w-full items-stretch overflow-hidden rounded-md border bg-[--color-card] shadow-[--shadow-sm]' + dim,
        style: active,
      },
        h('span', { class:'w-1 shrink-0', style:`background:${laneVar}` }),
        iconTile, body,
      );
    }

    function render() {
      const root = document.getElementById('timeline');
      const phases = [];
      let pi = -1;
      for (const s of STEPS) {
        let g = phases.find(p => p.name === s.phase);
        if (!g) { pi++; g = { name:s.phase, tint:TINT[pi % TINT.length], steps:[] }; phases.push(g); }
        g.steps.push(s);
      }
      for (const p of phases) {
        const label = h('div', {
          class:'mb-2 inline-flex items-center gap-2 rounded-full px-2.5 py-0.5 text-[11px] font-semibold uppercase tracking-wide',
          style:`background:var(${p.tint}-soft); color:var(${p.tint}-ink)`,
          text: p.name,
        });
        const rows = h('ol', { class:'relative ml-1 space-y-2 border-l border-[--color-border] pl-5' });
        for (const s of p.steps) {
          const node = h('div', { class:'absolute -left-[2.1rem] flex' }, railNode(s));
          rows.append(h('li', { class:'relative flex items-center gap-3' }, node, card(s)));
        }
        root.append(h('div', { class:'relative mb-1' }, label, rows));
      }
      lucide.createIcons();
    }
    render();
  </script>
</body>
</html>
