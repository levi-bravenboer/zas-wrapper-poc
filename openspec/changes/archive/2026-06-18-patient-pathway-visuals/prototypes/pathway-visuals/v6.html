<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PROTOTYPE — pathway-visuals v6 (minimal glance)</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5/index.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style type="text/tailwindcss">
    @theme {
      --color-background: oklch(1 0 0);
      --color-surface-1: oklch(0.985 0.003 175);
      --color-surface-2: oklch(0.97 0.01 175);
      --color-foreground: oklch(0.21 0.04 265);
      --color-foreground-muted: oklch(0.5 0.02 265);
      --color-card: var(--color-background);
      --color-primary: oklch(0.46 0.07 175);
      --color-primary-soft: oklch(0.93 0.04 175);
      --color-border: oklch(0.91 0.005 265);
      --color-border-strong: oklch(0.82 0.01 265);
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --shadow-sm: 0 1px 2px oklch(0.21 0.04 265 / 0.06);
      --font-sans: "Geist Variable", ui-sans-serif, system-ui, sans-serif;
    }
  </style>
  <style>
    :root {
      --ph-1-ink:#08453c;
      --lane-patient:#266b5e; --lane-caregiver:#2563eb; --lane-system:#7c3aed; --lane-external:#b45309;
      --red-ink:#b42318;
    }
    body { font-family: var(--font-sans); background:#f4f6f5; color: var(--color-foreground); }
  </style>
</head>
<body class="min-h-screen">
  <!--
    PROTOTYPE — patient Zorgpad SUMMARY BANNER v6 (minimal glance)
    Caregiver wants only: where does the patient stand, what just happened, what's next.
    All detail lives in the Zorgpad detail tab. So the banner is a 3-slot glance:
      Gedaan (last finished) → Nu (current) → Straks (next)
    derived from buckets — works for ANY pathway (size/branches/parallel), fixed footprint.
    Toggle two very different pathways top-right. Zero fetches. DOM via createElement.
  -->
  <div class="mx-auto max-w-6xl px-8 py-6">

    <div class="flex items-start justify-between">
      <div>
        <h1 class="text-2xl font-semibold tracking-tight">Claes, Jonas</h1>
        <div class="mt-1 flex items-center gap-2 text-sm text-[--color-foreground-muted]">
          <span class="rounded-md bg-[--color-surface-2] px-2 py-0.5 font-mono text-xs">INSZ: 02091852539</span>
          <span>Geboren 18-09-2002</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-[11px] text-[--color-foreground-muted]">demo:</span>
        <button data-ds="bladder" class="ds-btn rounded-md border border-[--color-border] bg-[--color-card] px-2.5 py-1 text-xs font-medium shadow-[--shadow-sm]">Blaaskanker (lang)</button>
        <button data-ds="rehab" class="ds-btn rounded-md border border-[--color-border] bg-[--color-card] px-2.5 py-1 text-xs font-medium shadow-[--shadow-sm]">Rugrevalidatie (kort)</button>
      </div>
    </div>

    <div class="mt-5 mb-2 flex items-center justify-between">
      <h2 class="text-lg font-semibold tracking-tight">Zorgpad</h2>
      <button class="rounded-md border border-[--color-border] bg-[--color-card] px-3 py-1.5 text-xs font-medium shadow-[--shadow-sm] hover:border-[--color-border-strong]">Nieuw zorgpad</button>
    </div>

    <!-- ===== MINIMAL GLANCE BANNER ===== -->
    <section id="banner" class="rounded-xl border border-[--color-border] bg-[--color-card] px-5 py-4 shadow-[--shadow-sm]"></section>

    <div class="mt-4 flex gap-5 border-b border-[--color-border] px-1 text-sm">
      <span class="border-b-2 border-[--color-primary] pb-2 font-medium text-[--color-foreground]">Overzicht</span>
      <span class="pb-2 text-[--color-foreground-muted]">Zorgpad</span>
      <span class="pb-2 text-[--color-foreground-muted]">Metingen</span>
      <span class="pb-2 text-[--color-foreground-muted]">Afspraken</span>
    </div>

    <p class="mt-4 text-center text-[11px] text-[--color-foreground-muted]">PROTOTYPE · pathway-visuals v6 (minimal glance) · detail leeft in de Zorgpad-tab</p>
  </div>

  <script>
    const LANE = { patient:'--lane-patient', caregiver:'--lane-caregiver', system:'--lane-system', external:'--lane-external' };
    const DATASETS = {
      bladder: {
        name:'Blaaskanker (urologie)', state:'active', phaseName:'Besluit tot biopsie', done:5, total:9,
        last: { lane:'caregiver', icon:'list-checks', name:'Scan beoordelen', sub:'Dr. de Vries · 17 jun' },
        now:  { lane:'caregiver', icon:'users', name:'MDO (diagnostisch)', sub:'Uroloog (lead) + panel', overdue:'2 dagen te laat', moreNow:0 },
        next: { lane:'caregiver', icon:'calendar', name:'Uitslag bespreken', sub:'Uroloog · consult' },
      },
      rehab: {
        name:'Rugrevalidatie', state:'active', phaseName:'Behandeling', done:2, total:5,
        last: { lane:'caregiver', icon:'flag', name:'Intakegesprek', sub:'02 jun' },
        now:  { lane:'caregiver', icon:'activity', name:'Oefenprogramma week 2', sub:'Fysiotherapeut', moreNow:1 },
        next: { lane:'caregiver', icon:'calendar', name:'Evaluatieconsult', sub:'Gepland 30 jun' },
      },
    };

    function h(tag, props, ...kids) {
      const node = document.createElement(tag);
      if (props) for (const [k, v] of Object.entries(props)) {
        if (v == null) continue;
        if (k === 'class') node.className = v;
        else if (k === 'text') node.textContent = v;
        else node.setAttribute(k, v);
      }
      for (const kid of kids) if (kid != null) node.append(kid);
      return node;
    }
    const icon = (name, cls) => h('i', { 'data-lucide': name, class: cls || 'size-4' });

    // one glance slot: small icon + name + sub, with a state tone
    function slot(label, step, tone) {
      const laneVar = `var(${LANE[step.lane]})`;
      const isNow = tone === 'now';
      const tile = h('span', {
        class:'grid size-9 shrink-0 place-items-center rounded-full',
        style: tone==='done'
          ? `background:${laneVar}; color:#fff`
          : isNow
            ? `background:${laneVar}; color:#fff; box-shadow:0 0 0 4px color-mix(in srgb, ${step.overdue?'var(--red-ink)':laneVar} 24%, transparent)`
            : `border:1px solid var(--color-border-strong); background:color-mix(in srgb, ${laneVar} 8%, var(--color-card)); color:${laneVar}`,
      }, tone==='done' ? icon('check') : icon(step.icon));

      const nameLine = h('p', { class:'truncate text-[13px] font-semibold tracking-tight ' + (isNow ? '' : 'text-[--color-foreground]'), text: step.name });
      const subParts = [ h('span', { class:'truncate', text: step.sub }) ];
      if (step.overdue) subParts.unshift(h('span', { class:'mr-1 font-semibold', style:'color:var(--red-ink)', text: step.overdue + ' ·' }));
      if (step.moreNow) subParts.push(h('span', { class:'ml-1 shrink-0 font-medium text-[--color-primary]', text:`+${step.moreNow} meer` }));
      const sub = h('p', { class:'flex items-center truncate text-[11.5px] font-medium text-[--color-foreground-muted]' }, ...subParts);

      return h('div', { class:'flex min-w-0 flex-1 flex-col gap-1.5' },
        h('p', { class:'text-[11px] font-semibold uppercase tracking-wide ' + (isNow ? 'text-[--color-foreground]' : 'text-[--color-foreground-muted]'), text: label }),
        h('div', { class:'flex min-w-0 items-center gap-2.5' }, tile, h('div', { class:'min-w-0' }, nameLine, sub)),
      );
    }

    function arrow() {
      return h('span', { class:'mt-6 hidden shrink-0 text-[--color-border-strong] sm:block' }, icon('chevron-right','size-5'));
    }

    function renderBanner(ds) {
      const b = document.getElementById('banner');
      b.replaceChildren();

      // header: status + name + phase + progress
      const pct = Math.round(ds.done / ds.total * 100);
      b.append(h('div', { class:'flex flex-wrap items-center gap-x-2 gap-y-1' },
        h('span', { class:'rounded-full bg-[--color-primary-soft] px-2.5 py-0.5 text-xs font-medium text-[--color-primary]', text: ds.state==='paused'?'Gepauzeerd':'Actief' }),
        h('span', { class:'text-sm font-medium', text: ds.name }),
        h('span', { class:'text-sm text-[--color-foreground-muted]' }, h('span',{text:'· Fase '}), h('span',{style:'color:var(--ph-1-ink); font-weight:600', text: ds.phaseName})),
        h('span', { class:'ml-auto text-sm font-semibold', text:`${ds.done}/${ds.total} afgerond` }),
      ));
      // thin meter
      b.append(h('div', { class:'mt-2 h-1 w-full overflow-hidden rounded-full bg-[--color-surface-2]' },
        h('div', { class:'h-full rounded-full bg-[--color-primary]', style:`width:${pct}%` })));

      // the 3-slot glance
      b.append(h('div', { class:'mt-4 flex items-start gap-3' },
        slot('Gedaan', ds.last, 'done'), arrow(),
        slot('Nu', ds.now, 'now'), arrow(),
        slot('Straks', ds.next, 'next'),
      ));

      lucide.createIcons();
    }

    let current = 'bladder';
    function setActive() {
      document.querySelectorAll('.ds-btn').forEach(x => {
        const on = x.dataset.ds === current;
        x.style.borderColor = on ? 'var(--color-primary)' : 'var(--color-border)';
        x.style.color = on ? 'var(--color-primary)' : '';
        x.style.background = on ? 'var(--color-primary-soft)' : 'var(--color-card)';
      });
    }
    document.querySelectorAll('.ds-btn').forEach(x => x.addEventListener('click', () => { current = x.dataset.ds; setActive(); renderBanner(DATASETS[current]); }));
    setActive();
    renderBanner(DATASETS[current]);
  </script>
</body>
</html>
