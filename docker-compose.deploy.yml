# AWS demo deploy stack (single EC2). Differences vs docker-compose.yml:
#   - backend/worker/orchestrator pull from ECR (no build:)
#   - orchestrator nginx service terminates TLS (Let's Encrypt) + host-routes
#   - Temporal persists to the shared Postgres (auto-setup), not start-dev
#   - Postgres published on loopback only (SSM tunnel for ad-hoc psql)
#   - browser-facing URLs point at app./api.zas.lebba.nl; backend↔Ory stay internal
# Secrets come from ./apps/backend/.env (synced from S3 on boot).
# Image refs resolve from ${ECR_REGISTRY} + ${IMAGE_TAG} exported by user-data.

name: zas

services:
  db:
    image: postgres:17-alpine
    container_name: zas_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zas}
      POSTGRES_DB: ${POSTGRES_DB:-zas}
    ports:
      - "127.0.0.1:5432:5432" # loopback only — reach via SSM port-forward
    volumes:
      - zas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zas} -d ${POSTGRES_DB:-zas}"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [zas_net]

  ory-db-init:
    image: postgres:17-alpine
    container_name: zas_ory_db_init
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "psql -h db -U ${POSTGRES_USER:-zas} -d ${POSTGRES_DB:-zas} -tc \"SELECT 1 FROM pg_database WHERE datname = 'kratos'\" | grep -q 1 || psql -h db -U ${POSTGRES_USER:-zas} -d ${POSTGRES_DB:-zas} -c 'CREATE DATABASE kratos';
       psql -h db -U ${POSTGRES_USER:-zas} -d ${POSTGRES_DB:-zas} -tc \"SELECT 1 FROM pg_database WHERE datname = 'keto'\"   | grep -q 1 || psql -h db -U ${POSTGRES_USER:-zas} -d ${POSTGRES_DB:-zas} -c 'CREATE DATABASE keto'"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-zas}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [zas_net]

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    container_name: zas_kratos_migrate
    command: migrate sql -e --yes
    environment:
      DSN: postgres://${POSTGRES_USER:-zas}:${POSTGRES_PASSWORD:-zas}@db:5432/kratos?sslmode=disable
    depends_on:
      ory-db-init:
        condition: service_completed_successfully
    restart: "no"
    networks: [zas_net]

  kratos:
    image: oryd/kratos:v26.2.0
    container_name: zas_kratos
    command: serve -c /etc/config/kratos/kratos.yml --dev
    environment:
      DSN: postgres://${POSTGRES_USER:-zas}:${POSTGRES_PASSWORD:-zas}@db:5432/kratos?sslmode=disable
      # Browser-facing self-service flows resolve against the real domain
      # (proxied same-origin by nginx at /.ory). Ory env overrides use the
      # config path in UPPER_SNAKE with NO product prefix (cf. DSN above).
      SERVE_PUBLIC_BASE_URL: https://${APP_HOST}/.ory
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: https://${APP_HOST}/
      SELFSERVICE_ALLOWED_RETURN_URLS: https://${APP_HOST}
    volumes:
      - ./infra/ory/kratos:/etc/config/kratos:ro
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [zas_net]

  keto-migrate:
    image: oryd/keto:v26.2.0
    container_name: zas_keto_migrate
    command: migrate up -y -c /etc/config/keto/keto.yml
    environment:
      DSN: postgres://${POSTGRES_USER:-zas}:${POSTGRES_PASSWORD:-zas}@db:5432/keto?sslmode=disable
    volumes:
      - ./infra/ory/keto:/etc/config/keto:ro
    depends_on:
      ory-db-init:
        condition: service_completed_successfully
    restart: "no"
    networks: [zas_net]

  keto:
    image: oryd/keto:v26.2.0
    container_name: zas_keto
    command: serve -c /etc/config/keto/keto.yml
    environment:
      DSN: postgres://${POSTGRES_USER:-zas}:${POSTGRES_PASSWORD:-zas}@db:5432/keto?sslmode=disable
    volumes:
      - ./infra/ory/keto:/etc/config/keto:ro
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [zas_net]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: zas_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - zas_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [zas_net]

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: zas_minio_init
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
       mc mb --ignore-existing local/zas-attachments"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks: [zas_net]

  # Temporal with Postgres persistence (auto-setup creates schemas on boot).
  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: zas_temporal
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-zas}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-zas}
      POSTGRES_SEEDS: db
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      # Bind all interfaces (incl loopback) so the 127.0.0.1 healthcheck works
      # and service-DNS clients (backend/worker) reach it.
      BIND_ON_IP: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "127.0.0.1:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [zas_net]

  backend:
    image: ${ECR_REGISTRY}/zas-backend:${IMAGE_TAG}
    container_name: zas_backend
    environment:
      SEED_PROFILE: demo
      # Block the seed until Ory/Temporal/DB are reachable so the Kratos
      # import + Keto reconcile don't no-op (login/authz would break).
      WAIT_FOR_HOSTS: db:5432,kratos:4433,keto:4467,temporal:7233
      # Seeded admin = the deployer (from the root .env synced off S3).
      BACKEND_BOOTSTRAP_ADMIN_EMAIL: ${BACKEND_BOOTSTRAP_ADMIN_EMAIL}
      BACKEND_BOOTSTRAP_ADMIN_NAME: ${BACKEND_BOOTSTRAP_ADMIN_NAME}
      BACKEND_BOOTSTRAP_ADMIN_PASSWORD: ${BACKEND_BOOTSTRAP_ADMIN_PASSWORD}
      BACKEND_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-zas}:${POSTGRES_PASSWORD:-zas}@db:5432/zas
      BACKEND_HIX_MODE: stub
      BACKEND_LOG_LEVEL: INFO
      BACKEND_CORS_ORIGINS: '["https://${APP_HOST}"]'
      # backend↔Ory stay on the docker network (NOT the public domain)
      BACKEND_KRATOS_PUBLIC_URL: http://kratos:4433
      BACKEND_KRATOS_ADMIN_URL: http://kratos:4434
      BACKEND_KETO_READ_URL: http://keto:4466
      BACKEND_KETO_WRITE_URL: http://keto:4467
      BACKEND_AUTHZ_KETO_ENABLED: "true"
      BACKEND_LUSCII_FIXTURES: "true"
      BACKEND_PATHWAY_RUNTIME_ENGINE: temporal
      BACKEND_TEMPORAL_ADDRESS: temporal:7233
      BACKEND_S3_ENDPOINT_URL: http://minio:9000
      BACKEND_S3_PUBLIC_URL: http://minio:9000
      BACKEND_S3_BUCKET: zas-attachments
      BACKEND_S3_REGION: eu-west-1
      BACKEND_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      BACKEND_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      db:
        condition: service_healthy
      kratos:
        condition: service_started
      keto:
        condition: service_started
      temporal:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status == 200 else 1)\""
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks: [zas_net]

  worker:
    image: ${ECR_REGISTRY}/zas-backend:${IMAGE_TAG}
    container_name: zas_pathway_worker
    entrypoint: ["uv", "run", "python", "-m", "app.temporal.worker"]
    environment:
      BACKEND_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-zas}:${POSTGRES_PASSWORD:-zas}@db:5432/zas
      BACKEND_LOG_LEVEL: INFO
      BACKEND_TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      backend:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: unless-stopped
    networks: [zas_net]

  orchestrator:
    image: ${ECR_REGISTRY}/zas-orchestrator:${IMAGE_TAG}
    container_name: zas_orchestrator
    environment:
      APP_HOST: ${APP_HOST}
      API_HOST: ${API_HOST}
      LE_EMAIL: ${LE_EMAIL}
      BACKEND_UPSTREAM: http://backend:8000
      KRATOS_PUBLIC_UPSTREAM: http://kratos:4433
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - zas_letsencrypt:/etc/letsencrypt
      - zas_certbot_www:/var/www/certbot
    depends_on:
      # started, not healthy — nginx must come up to serve the ACME challenge
      # and the SPA even if the backend is still warming.
      backend:
        condition: service_started
    restart: unless-stopped
    networks: [zas_net]

volumes:
  zas_pgdata:
    name: zas_pgdata
  zas_minio_data:
    name: zas_minio_data
  zas_letsencrypt:
    name: zas_letsencrypt
  zas_certbot_www:
    name: zas_certbot_www

networks:
  zas_net:
    name: zas_net
