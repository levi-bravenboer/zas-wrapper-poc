# Dev stack for the zas-wrapper monorepo.
# Host-side env defaults live in apps/backend/.env.example;
# this file overrides them for the in-container backend.
# Required: docker compose v2.24+ (develop.watch + env_file required:false).

name: zas

services:
  db:
    image: postgres:17-alpine
    container_name: zas_db
    environment:
      POSTGRES_USER: zas
      POSTGRES_PASSWORD: zas
      POSTGRES_DB: zas
    ports:
      - "5434:5432"
    volumes:
      - zas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zas -d zas"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [zas_net]

  # Creates the kratos + keto databases inside the shared postgres once per volume.
  # Idempotent: re-runs are no-ops on an initialised volume.
  ory-db-init:
    image: postgres:17-alpine
    container_name: zas_ory_db_init
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "psql -h db -U zas -d zas -tc \"SELECT 1 FROM pg_database WHERE datname = 'kratos'\" | grep -q 1 || psql -h db -U zas -d zas -c 'CREATE DATABASE kratos';
       psql -h db -U zas -d zas -tc \"SELECT 1 FROM pg_database WHERE datname = 'keto'\"   | grep -q 1 || psql -h db -U zas -d zas -c 'CREATE DATABASE keto'"
    environment:
      PGPASSWORD: zas
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [zas_net]

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    container_name: zas_kratos_migrate
    command: migrate sql -e --yes
    environment:
      DSN: postgres://zas:zas@db:5432/kratos?sslmode=disable
    depends_on:
      ory-db-init:
        condition: service_completed_successfully
    restart: "no"
    networks: [zas_net]

  kratos:
    image: oryd/kratos:v26.2.0
    container_name: zas_kratos
    command: serve -c /etc/config/kratos/kratos.yml --dev
    environment:
      DSN: postgres://zas:zas@db:5432/kratos?sslmode=disable
    ports:
      - "4433:4433" # public API (whoami, self-service flows)
      - "4434:4434" # admin API (identity import, session revocation)
    volumes:
      - ./infra/ory/kratos:/etc/config/kratos:ro
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    networks: [zas_net]

  keto-migrate:
    image: oryd/keto:v26.2.0
    container_name: zas_keto_migrate
    command: migrate up -y -c /etc/config/keto/keto.yml
    environment:
      DSN: postgres://zas:zas@db:5432/keto?sslmode=disable
    volumes:
      - ./infra/ory/keto:/etc/config/keto:ro
    depends_on:
      ory-db-init:
        condition: service_completed_successfully
    restart: "no"
    networks: [zas_net]

  keto:
    image: oryd/keto:v26.2.0
    container_name: zas_keto
    command: serve -c /etc/config/keto/keto.yml
    environment:
      DSN: postgres://zas:zas@db:5432/keto?sslmode=disable
    ports:
      - "4466:4466" # read API (check, expand, relation queries)
      - "4467:4467" # write API (tuple insert/delete)
    volumes:
      - ./infra/ory/keto:/etc/config/keto:ro
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
    networks: [zas_net]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: zas_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - zas_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [zas_net]

  # One-shot bucket creation (mirrors zas_ory_db_init). Idempotent:
  # `mb --ignore-existing` is a no-op once the bucket exists.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: zas_minio_init
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mc alias set local http://minio:9000 minioadmin minioadmin;
       mc mb --ignore-existing local/zas-attachments"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks: [zas_net]

  backend:
    image: zas_backend:dev
    container_name: zas_backend
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    # The host-side .env (gitignored) feeds the container at runtime — so
    # BACKEND_LUSCII_API_TOKEN lives in exactly one file and is never baked
    # into the image. Luscii stays token-presence-driven: no file or no token
    # ⇒ unconfigured (503 luscii_not_configured). `environment:` below wins
    # over the file for everything compose must pin (DB host, CORS, Ory URLs).
    env_file:
      - path: ./apps/backend/.env
        required: false
    environment:
      BACKEND_DATABASE_URL: postgresql+asyncpg://zas:zas@db:5432/zas
      BACKEND_HIX_MODE: stub
      BACKEND_LOG_LEVEL: INFO
      BACKEND_CORS_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://localhost:5175"]'
      BACKEND_KRATOS_PUBLIC_URL: http://kratos:4433
      BACKEND_KRATOS_ADMIN_URL: http://kratos:4434
      BACKEND_KETO_READ_URL: http://keto:4466
      BACKEND_KETO_WRITE_URL: http://keto:4467
      # relation checks on by default in the compose stack (Kratos + Keto are
      # always part of it); flip off per-shell for flag-off debugging:
      # BACKEND_AUTHZ_KETO_ENABLED=false docker compose up -d backend
      BACKEND_AUTHZ_KETO_ENABLED: ${BACKEND_AUTHZ_KETO_ENABLED:-true}
      # Local-dev fixture mode: when no real Luscii token is configured,
      # serve canned demo data via `LusciiFixtureClient` so the chart UI is
      # immediately usable after `moon run :up` + `seed_all`. Set
      # `BACKEND_LUSCII_FIXTURES=false` to fall back to the unconfigured
      # state (useful when validating the not-configured panel).
      BACKEND_LUSCII_FIXTURES: ${BACKEND_LUSCII_FIXTURES:-true}
      # Pathway runtime via Temporal: the API starts a workflow per enrollment
      # and routes caregiver actions through Updates/Signals. Flip to `sync`
      # to run the engine inline (no worker needed):
      #   BACKEND_PATHWAY_RUNTIME_ENGINE=sync docker compose up -d backend
      BACKEND_PATHWAY_RUNTIME_ENGINE: ${BACKEND_PATHWAY_RUNTIME_ENGINE:-temporal}
      BACKEND_TEMPORAL_ADDRESS: temporal:7233
      # S3-compatible object storage. The in-network endpoint reaches MinIO by
      # service name; the public URL is the browser-reachable host presigned
      # URLs are signed against (SigV4 binds the URL to its host).
      BACKEND_S3_ENDPOINT_URL: http://minio:9000
      BACKEND_S3_PUBLIC_URL: http://localhost:9000
      BACKEND_S3_BUCKET: zas-attachments
      BACKEND_S3_REGION: eu-west-1
      BACKEND_S3_ACCESS_KEY: minioadmin
      BACKEND_S3_SECRET_KEY: minioadmin
    ports:
      - "18000:8000"
    develop:
      watch:
        - path: ./apps/backend
          target: /app
          action: sync
          ignore:
            - .venv/
            - __pycache__/
            - .pytest_cache/
            - .ruff_cache/
            - .mypy_cache/
            - "*.db"
        - path: ./apps/backend/uv.lock
          action: rebuild
        - path: ./apps/backend/pyproject.toml
          action: rebuild
        - path: ./apps/backend/Dockerfile
          action: rebuild
    depends_on:
      db:
        condition: service_healthy
      # relation checks default on, so the backend must not come up without Ory
      kratos:
        condition: service_started
      keto:
        condition: service_started
      temporal:
        condition: service_healthy
      # the attachments bucket must exist before the backend mints presigned URLs
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status == 200 else 1)\""
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [zas_net]

  # Temporal dev server for the pathway runtime. In-memory dev server (no
  # external DB) — fine for local/PoC; a production deploy points at a
  # persistent Temporal cluster instead. gRPC :7233, Web UI :8233.
  temporal:
    image: temporalio/temporal:1.7.2
    container_name: zas_temporal
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--namespace", "default"]
    ports:
      - "7233:7233"
      - "8233:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [zas_net]

  # Pathway-runtime worker — same image as the backend, separate process.
  # Runs `PathwayEnrollmentWorkflow` + activities. Skips the backend
  # entrypoint (migrate + seed) since `backend` owns that; waits for it to
  # be healthy so the schema + seed exist before any activity runs.
  worker:
    image: zas_backend:dev
    container_name: zas_pathway_worker
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    entrypoint: ["uv", "run", "python", "-m", "app.temporal.worker"]
    env_file:
      - path: ./apps/backend/.env
        required: false
    environment:
      BACKEND_DATABASE_URL: postgresql+asyncpg://zas:zas@db:5432/zas
      BACKEND_LOG_LEVEL: INFO
      BACKEND_TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      backend:
        condition: service_healthy
      temporal:
        condition: service_healthy
    networks: [zas_net]

volumes:
  zas_pgdata:
    name: zas_pgdata
  zas_minio_data:
    name: zas_minio_data

networks:
  zas_net:
    name: zas_net
