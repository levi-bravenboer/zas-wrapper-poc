# Dev stack for the zas-wrapper monorepo.
# Host-side env defaults live in apps/backend/.env.example;
# this file overrides them for the in-container backend.
# Required: docker compose v2.22+ (uses develop.watch).

name: zas

services:
  db:
    image: postgres:17-alpine
    container_name: zas_db
    environment:
      POSTGRES_USER: zas
      POSTGRES_PASSWORD: zas
      POSTGRES_DB: zas
    ports:
      - "5434:5432"
    volumes:
      - zas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zas -d zas"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [zas_net]

  # Creates the kratos + keto databases inside the shared postgres once per volume.
  # Idempotent: re-runs are no-ops on an initialised volume.
  ory-db-init:
    image: postgres:17-alpine
    container_name: zas_ory_db_init
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "psql -h db -U zas -d zas -tc \"SELECT 1 FROM pg_database WHERE datname = 'kratos'\" | grep -q 1 || psql -h db -U zas -d zas -c 'CREATE DATABASE kratos';
       psql -h db -U zas -d zas -tc \"SELECT 1 FROM pg_database WHERE datname = 'keto'\"   | grep -q 1 || psql -h db -U zas -d zas -c 'CREATE DATABASE keto'"
    environment:
      PGPASSWORD: zas
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [zas_net]

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    container_name: zas_kratos_migrate
    command: migrate sql -e --yes
    environment:
      DSN: postgres://zas:zas@db:5432/kratos?sslmode=disable
    depends_on:
      ory-db-init:
        condition: service_completed_successfully
    restart: "no"
    networks: [zas_net]

  kratos:
    image: oryd/kratos:v26.2.0
    container_name: zas_kratos
    command: serve -c /etc/config/kratos/kratos.yml --dev
    environment:
      DSN: postgres://zas:zas@db:5432/kratos?sslmode=disable
    ports:
      - "4433:4433" # public API (whoami, self-service flows)
      - "4434:4434" # admin API (identity import, session revocation)
    volumes:
      - ./infra/ory/kratos:/etc/config/kratos:ro
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    networks: [zas_net]

  keto-migrate:
    image: oryd/keto:v26.2.0
    container_name: zas_keto_migrate
    command: migrate up -y -c /etc/config/keto/keto.yml
    environment:
      DSN: postgres://zas:zas@db:5432/keto?sslmode=disable
    volumes:
      - ./infra/ory/keto:/etc/config/keto:ro
    depends_on:
      ory-db-init:
        condition: service_completed_successfully
    restart: "no"
    networks: [zas_net]

  keto:
    image: oryd/keto:v26.2.0
    container_name: zas_keto
    command: serve -c /etc/config/keto/keto.yml
    environment:
      DSN: postgres://zas:zas@db:5432/keto?sslmode=disable
    ports:
      - "4466:4466" # read API (check, expand, relation queries)
      - "4467:4467" # write API (tuple insert/delete)
    volumes:
      - ./infra/ory/keto:/etc/config/keto:ro
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
    networks: [zas_net]

  backend:
    image: zas_backend:dev
    container_name: zas_backend
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    environment:
      BACKEND_DATABASE_URL: postgresql+asyncpg://zas:zas@db:5432/zas
      BACKEND_HIX_MODE: stub
      BACKEND_LUSCII_MODE: stub
      BACKEND_LOG_LEVEL: INFO
      BACKEND_CORS_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://localhost:5175"]'
      BACKEND_KRATOS_PUBLIC_URL: http://kratos:4433
      BACKEND_KRATOS_ADMIN_URL: http://kratos:4434
      BACKEND_KETO_READ_URL: http://keto:4466
      BACKEND_KETO_WRITE_URL: http://keto:4467
      # relation checks on by default in the compose stack (Kratos + Keto are
      # always part of it); flip off per-shell for flag-off debugging:
      # BACKEND_AUTHZ_KETO_ENABLED=false docker compose up -d backend
      BACKEND_AUTHZ_KETO_ENABLED: ${BACKEND_AUTHZ_KETO_ENABLED:-true}
    ports:
      - "18000:8000"
    develop:
      watch:
        - path: ./apps/backend
          target: /app
          action: sync
          ignore:
            - .venv/
            - __pycache__/
            - .pytest_cache/
            - .ruff_cache/
            - .mypy_cache/
            - "*.db"
        - path: ./apps/backend/uv.lock
          action: rebuild
        - path: ./apps/backend/pyproject.toml
          action: rebuild
        - path: ./apps/backend/Dockerfile
          action: rebuild
    depends_on:
      db:
        condition: service_healthy
      # relation checks default on, so the backend must not come up without Ory
      kratos:
        condition: service_started
      keto:
        condition: service_started
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status == 200 else 1)\""
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [zas_net]

volumes:
  zas_pgdata:
    name: zas_pgdata

networks:
  zas_net:
    name: zas_net
