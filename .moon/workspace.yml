$schema: "https://moonrepo.dev/schemas/workspace.json"

# Discover projects from these globs. Add packages/ when shared libs land.
projects:
  zas-root: "."
  backend: "apps/backend"
  orchestrator: "apps/orchestrator"

vcs:
  defaultBranch: "main"
  provider: "github"

constraints:
  enforceLayerRelationships: true
