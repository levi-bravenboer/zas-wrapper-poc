name: setup-orchestrator
description: Install Node (from .nvmrc) + pnpm and run pnpm install for apps/orchestrator.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 9.15.1
        run_install: false

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: apps/orchestrator/pnpm-lock.yaml

    - name: pnpm install
      shell: bash
      run: pnpm install --frozen-lockfile
      working-directory: apps/orchestrator

    - name: generate route tree
      shell: bash
      run: pnpm exec tsr generate
      working-directory: apps/orchestrator
