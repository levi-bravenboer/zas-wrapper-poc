$schema: "https://moonrepo.dev/schemas/project.json"

layer: "application"
language: "typescript"
stack: "frontend"

project:
  name: "orchestrator"
  description: "Clinician composer surface."

fileGroups:
  sources:
    - "src/**/*"
    - "index.html"
    - "vite.config.ts"
    - "vitest.config.ts"
    - "playwright.config.ts"
    - "tsconfig*.json"
  tests:
    - "src/**/*.test.{ts,tsx}"
    - "tests-e2e/**/*"

tasks:
  install:
    command: "pnpm install"
    inputs:
      - "package.json"
      - "pnpm-lock.yaml"
    options:
      cache: false

  dev:
    command: "pnpm run dev"
    preset: "server"

  build:
    command: "pnpm run build"
    deps:
      - "~:typecheck"
    outputs:
      - "dist"

  typecheck:
    command: "pnpm exec tsc -b --noEmit"

  lint:
    command: "pnpm run lint"

  format:
    command: "pnpm run format"

  preview:
    command: "pnpm run preview"
    preset: "server"

  test:
    command: "pnpm run test"

  test-coverage:
    command: "pnpm run test:coverage"

  test-e2e:
    command: "pnpm run test:e2e"

  typegen:
    command: "pnpm run typegen"
