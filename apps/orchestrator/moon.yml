$schema: "https://moonrepo.dev/schemas/project.json"

layer: "application"
language: "typescript"
stack: "frontend"

project:
  name: "orchestrator"
  description: "Clinician composer surface."

fileGroups:
  sources:
    - "src/**/*"
    - "index.html"
    - "vite.config.ts"
    - "vitest.config.ts"
    - "playwright.config.ts"
    - "tsconfig*.json"
  tests:
    - "src/**/*.test.{ts,tsx}"
    - "tests-e2e/**/*"

tasks:
  dev:
    command: "npm run dev"
    preset: "server"

  build:
    command: "npm run build"
    deps:
      - "~:typecheck"
    outputs:
      - "dist"

  typecheck:
    command: "npx tsc -b --noEmit"

  lint:
    command: "npm run lint"

  format:
    command: "npm run format"

  preview:
    command: "npm run preview"
    preset: "server"

  test:
    command: "npm run test"

  test-e2e:
    command: "npm run test:e2e"

  typegen:
    command: "npm run typegen"
