$schema: "https://moonrepo.dev/schemas/project.json"

layer: "application"
language: "python"
stack: "backend"

project:
  name: "backend"
  description: "FastAPI FHIR gateway + MCP host."

fileGroups:
  sources:
    - "main.py"
    - "app/**/*.py"
    - "scripts/**/*.py"
    - "pyproject.toml"
  tests:
    - "tests/**/*.py"

tasks:
  install:
    command: "uv sync"
    inputs:
      - "pyproject.toml"
      - "uv.lock"
    options:
      cache: false

  dev:
    command: "docker compose up --build backend"
    env:
      COMPOSE_FILE: "../../docker-compose.yml"
    preset: "server"
    options:
      cache: false
      runInCI: false

  test:
    command: "docker compose run --rm --build test_runner"
    env:
      COMPOSE_FILE: "../../docker-compose.yml:../../docker-compose.test.yml"
    options:
      cache: false

  # Host-side pytest. Hits the test DB exposed by docker-compose on
  # `localhost:5433`. Stable prefix so it can be pre-approved as a safe
  # command for autonomous agents. Passthrough args:
  #   moon run backend:test-host -- tests/api/events/
  test-host:
    command: "uv run pytest"
    env:
      BACKEND_DATABASE_URL: "postgresql+asyncpg://zas:zas@localhost:5433/zas_test"
    options:
      cache: false
      runInCI: false

  shell:
    command: "docker compose exec backend bash"
    env:
      COMPOSE_FILE: "../../docker-compose.yml"
    options:
      cache: false
      runInCI: false

  psql:
    command: "docker compose exec db psql -U zas -d zas"
    env:
      COMPOSE_FILE: "../../docker-compose.yml"
    options:
      cache: false
      runInCI: false

  migrate:
    command: "docker compose exec backend uv run alembic upgrade head"
    env:
      COMPOSE_FILE: "../../docker-compose.yml"
    options:
      cache: false

  make-migration:
    command: "docker compose exec backend uv run alembic revision --autogenerate -m"
    env:
      COMPOSE_FILE: "../../docker-compose.yml"
    options:
      cache: false
      runInCI: false

  seed-tenant:
    command: "docker compose exec backend uv run python -m scripts.seed_tenant"
    env:
      COMPOSE_FILE: "../../docker-compose.yml"
    options:
      cache: false

  seed-users:
    command: "docker compose exec backend uv run python -m scripts.seed_users"
    env:
      COMPOSE_FILE: "../../docker-compose.yml"
    options:
      cache: false

  seed:
    command: "docker compose exec backend uv run python -m scripts.seed_all"
    env:
      COMPOSE_FILE: "../../docker-compose.yml"
    options:
      cache: false

  lint:
    command: "uv run ruff check"

  format:
    command: "uv run ruff format --check"

  typecheck:
    command: "uv run pyright"
    inputs:
      - "@group(sources)"
      - "@group(tests)"

  openapi:
    command: "uv run python -m app.openapi"
    inputs:
      - "@group(sources)"
    outputs:
      - "openapi.json"
