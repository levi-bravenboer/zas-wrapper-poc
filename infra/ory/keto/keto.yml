# Ory Keto config — local dev + CI. Pinned image: oryd/keto:v26.2.0 (docker-compose.yml).
# DSN comes from the DSN env var.

namespaces:
  location: file:///etc/config/keto/namespaces.keto.ts

serve:
  read:
    host: 0.0.0.0
    port: 4466
  write:
    host: 0.0.0.0
    port: 4467

log:
  level: info
  format: json
